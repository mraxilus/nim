# Build the browser bridge against the same RGA metric the desktop build uses --
#   `nim js browser_bridge.nim` picks this up automatically from this directory, the
#   same way `visualiser.nim.cfg` is picked up for the desktop entry point.
#   No `--backend:cpp` here: `nim js` already fixes the backend, and there is no
#   SDL3/OpenGL/Dear ImGui to link -- WebGL/DOM wiring lives in the untracked
#   `glue.js`, this build's own presentation layer.

--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

<title>RGA visualiser — browser</title>
<style>
  :root {
    --bg: #101318;
    --surface: rgba(22, 27, 34, 0.82);
    --surface-solid: #161b22;
    --surface-raised: #1b212b;
    --border: #2a323d;
    --ink: #e7ecf1;
    --ink-muted: #8b96a3;
    --ink-faint: #5b6673;
    --accent: #00a7a5;
    --accent-ink: #bdf3f0;
    --danger: #e0577a;
    /* The four frame-rate bands the exceedance curve is drawn in, worst last. A **status**
       ramp, deliberately not the object palette: an object's colour says which object, and
       reusing one here would have the curve impersonate a series.
         Screened through the dataviz skill's own validator against this drawer's surface,
       exactly as `mesh.nim`'s object palette was: all four sit inside the dark lightness
       band, clear 3:1 contrast, and hold the normal-vision floor (worst adjacent pair at
       16.3). The green is a **jade** rather than a pure green because pure green against
       amber measures deltaE 1.2 under protanopia -- indistinguishable -- where jade
       measures 7.9. The amber/red pair sits at 7.7 under deuteranopia, inside the 6-8 band
       the validator allows only with secondary encoding: here every band is bounded by its
       own *labelled* dashed line, so which band a stretch of curve is in is read from the
       120/60/30 beside it and never from hue alone. */
    --speed-fast: #3d8ee0;
    --speed-good: #14a06e;
    --speed-fair: #bb8215;
    --speed-poor: #d03b3b;
    /* "Noto Sans UI" sits in the mono and serif stacks as well as being the sans face:
       the maths and symbol faces are declared under that family by unicode-range, and
       neither Commit Mono nor Noto Serif carries a single one of those codepoints. Without
       it a bold operand or a wedge in mono text falls through to whatever the viewer's
       system happens to have, which is the one outcome embedding the faces exists to rule
       out -- and it renders fine on a machine that has DejaVu, so it does not show up
       locally. Listing the family costs nothing: CSS falls back per character, and the
       range-restricted faces only ever match the characters they are declared for. */
    --mono: "Commit Mono UI", "Noto Sans UI", ui-monospace, "SF Mono", Consolas, monospace;
    --sans: "Noto Sans UI", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --serif: "Noto Serif UI", "Noto Sans UI", Georgia, "Times New Roman", serif;
    /* Both written by `glue.js` from `nimAnimationMilliseconds`, so every transition below
       runs to the same constant a freshly added object grows in over rather than to a
       second number written down separately. The curve is easeOutCubic, matching
       `mesh.easeOutCubic` exactly. These literals are the pre-script fallback only. */
    --anim: 350ms;
    --ease: cubic-bezier(0.215, 0.61, 0.355, 1);
  }

  /* Embedded rather than linked: an artifact page cannot reach an external font
     host, and naming a face the viewer may not have installed would leave the two
     builds looking different. Faces and weights are exactly what the UI uses.
     Noto Sans has no mathematical operators or bold operands and Noto Sans Math
     has no stars or crosses, so all three are declared under one family and
     separated by unicode-range -- the same split `gui_shim.cpp` merges into one
     atlas for the desktop.
       Each `@EMBED:<file>@` names a WOFF2 in `fonts/` that `build_browser.sh`
     replaces with that file's own base64 data URL. The payload stays out of this
     file so the tracked source is 26 KB rather than the ~940 KB it assembles to,
     and so the fonts stay vendored -- kept locally, never committed -- the way
     `dependencies.list` already prescribes. Family, weight and unicode-range are
     tracked here beside the codepoints they cover; only the bytes are injected. */
  @font-face { font-family: "Noto Sans UI"; font-style: normal; font-weight: 400;
    font-display: block;
    src: url(@EMBED:noto-sans-latin-400-normal.woff2@) format("woff2"); }
  @font-face { font-family: "Noto Sans UI"; font-style: normal; font-weight: 600;
    font-display: block;
    src: url(@EMBED:noto-sans-latin-600-normal.woff2@) format("woff2"); }
  @font-face { font-family: "Noto Sans UI"; font-style: normal; font-weight: 400;
    font-display: block;
    unicode-range: U+2190-21FF, U+2200-22FF, U+2300-23FF, U+27C0-27EF, U+2A00-2AFF, U+1D400-1D7FF;
    src: url(@EMBED:noto-sans-math-math-400-normal.woff2@) format("woff2"); }
  @font-face { font-family: "Noto Sans UI"; font-style: normal; font-weight: 400;
    font-display: block;
    unicode-range: U+25A0-25FF, U+2600-26FF, U+2700-27BF;
    src: url(@EMBED:noto-sans-symbols-2-symbols-400-normal.woff2@) format("woff2"); }
  @font-face { font-family: "Noto Serif UI"; font-style: normal; font-weight: 400;
    font-display: block;
    src: url(@EMBED:noto-serif-latin-400-normal.woff2@) format("woff2"); }
  @font-face { font-family: "Commit Mono UI"; font-style: normal; font-weight: 400;
    font-display: block;
    src: url(@EMBED:commit-mono-latin-400-normal.woff2@) format("woff2"); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--sans);
    color: var(--ink);
  }

  canvas#gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
  }

  /* The view is one ordinary tab stop, reached and left with Tab like every other
     control -- see `interaction.actionFor` on why Tab is deliberately not rebound. The
     ring is inset rather than outset because the canvas fills the viewport, so an
     outside ring would fall off every edge of the screen and show nothing. */
  canvas#gl:focus { outline: none; }
  canvas#gl:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }

  svg#overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* One wedge of the drag choice menu, styled to match `.selection-menu button` below:
     the wheel and that menu are the same control in two postures -- one reached by
     dragging, one by picking -- so a reader should not have to learn two appearances for
     it. The label is sized here rather than in the script so the rect behind it can be
     measured from what the browser actually laid it out as; see `appendChoiceMenu`. The
     label keeps the choice's own hue, set inline per wedge from `nimDragMenuLayout`, so
     join/meet/project still carry the colours the drawer's intro line gives them. */
  .menu-wedge-label {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    fill: var(--ink);
  }
  .menu-wedge {
    fill: var(--surface-raised);
    stroke: var(--border);
  }
  /* The wedge the cursor stands in, in the same accent every other "this one is in force"
     control on the page wears (`.btn.on`, `.help-tab.on`), on both the border and the
     label -- so the highlight survives a reader who cannot tell one hue from another. */
  .menu-wedge.on { stroke: var(--accent); }
  .menu-wedge-label.on { fill: var(--accent-ink); }
  /* The menu's own centre, where nothing is chosen. Its border rather than white, so the
     wheel is drawn entirely out of the tones the selection menu uses. */
  .menu-centre { stroke: var(--border); }

  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5; /* Above .drawer (4) -- position:fixed always opens its own stacking
      context, so a z-index set on .chip-row itself (a mere descendant) couldn't reach
      past .veil's own level to outrank .drawer; it has to be set here. Keeps undo/redo/
      axes/grid/menu reachable while a wide-viewport drawer (a full-height right panel)
      is open, rather than letting it cover that same top-right corner. */
  }

  .chip-row {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
  }

  .brand {
    appearance: none;
    cursor: pointer;
    color: inherit;
    font: inherit;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px 7px 10px;
  }
  .brand .mark {
    width: 9px; height: 9px;
    border-radius: 2px;
    background: var(--accent);
    transform: rotate(45deg);
    flex: none;
  }
  .brand .name {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
  }

  .toggles {
    pointer-events: auto;
    display: flex;
    gap: 6px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px;
  }
  .toggles button {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 7px 11px;
    border-radius: 999px;
    line-height: 1;
  }
  .toggles button.on {
    background: rgba(0, 167, 165, 0.16);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .toggles button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }


  /* ---- Message toast: outcome of the last action, transient ---- */
  /* ---- Help: where the controls are stated, bottom right ----
     The only statement of the controls in this build, and reachable at any time. A pill
     naming a few of them used to greet every load and leave after four seconds; the panel
     outgrew it, and a page that explains itself on demand needs no greeter.
     44px minimum, which is the touch-target size Apple's guidelines ask for and comfortably
     over the 24px WCAG 2.5.8 requires -- a control a reader reaches for when they are
     already lost is the last one to make them aim. */
  /* ---- Scale bar: what one cell of the ground grid measures ---- */
  .ruler {
    position: fixed;
    left: max(14px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 5;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-muted);
    text-shadow: 0 1px 2px var(--bg); /* Legible over a pale grid line as over dark sky. */
  }
  /* Drawn as a span with two end ticks rather than a filled block: the ticks are where the
     measurement actually starts and stops, and a block leaves that to the eye. */
  .ruler-bar {
    height: 5px;
    border: 1px solid var(--ink-faint);
    border-top: none;
    box-sizing: border-box;
  }
  .ruler-label {
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* The drawer opens over this corner, so the bar steps aside to the edge of it rather
     than being drawn across the object list. Set from the drawer's own toggle, since the
     bar sits before the drawer in the document and no sibling selector reaches backwards. */
  .ruler.aside { left: calc(min(400px, 100vw) + 14px); }

  .help-open {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 44px;
    height: 44px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 19px;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(9px);
    transition: color var(--anim) var(--ease), border-color var(--anim) var(--ease);
    z-index: 6;
  }
  .help-open:hover, .help-open:focus-visible {
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .help-panel {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px);
    /* Wide enough for the two columns wherever there is room, and the whole viewport
       less its margins where there is not -- the old flat 360px kept a 1400px window
       reading a phone-width column. */
    width: min(560px, calc(100vw - 28px));
    max-height: min(82vh, 620px);
    /* A column, so the rows box can be given whatever is left rather than a height worked
       out by hand. It used to subtract a flat 82px for the tab strip, which was wrong the
       moment anything else joined it above the rows -- the strip wraps to two lines on a
       phone, and there is now a description as well. Nothing here is measured off a
       constant any more, so the panel cannot outgrow the screen. */
    display: flex;
    flex-direction: column;
    padding: 12px 14px 14px;
    border-radius: 14px;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.45;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity var(--anim) var(--ease), transform var(--anim) var(--ease);
    z-index: 6;
  }
  .help-panel.show { opacity: 1; transform: none; pointer-events: auto; }
  /* The panel's own way out. It stays open until the reader closes it -- a tap outside no
     longer dismisses it -- so on a phone, which has no escape key and where the `?` that
     opened it may sit under the panel itself, this is the only way out. Pinned to the
     corner rather than placed in the tab strip, which wraps to two lines there. */
  .help-close {
    position: absolute;
    top: 6px;
    right: 8px;
    padding: 4px 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-muted);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .help-close:hover { color: var(--ink); background: var(--surface-raised); }
  /* Tabs wrap rather than scroll sideways: five short words fit one line on a desktop and
     two on a phone, and a horizontally scrolling strip hides the tabs past its edge. */
  .help-tabs {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    /* Clear of the close button pinned in the corner above, so a wrapped strip never runs
       under it. */
    padding-right: 26px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .help-tab {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: 1px solid transparent;
    border-radius: 999px;
    /* Past WCAG 2.5.8's 24px target on both axes once the padding is counted. */
    padding: 6px 11px;
    cursor: pointer;
  }
  .help-tab:hover, .help-tab:focus-visible { color: var(--ink); border-color: var(--border); }
  .help-tab.on { color: var(--accent-ink); border-color: var(--accent-ink); }
  /* What the open tab is about, above its rows. Outside `.help-rows` so it stays put while
     they scroll: a sentence that scrolls away is one a reader loses exactly when they need
     it. Its text comes from `help.descriptionOf` through `nimHelpDescriptions`, so this and
     the desktop's own line are the same sentence by construction. */
  .help-description {
    flex: none;
    margin: 0 0 10px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-muted);
  }
  /* Only the rows scroll, so the tab strip stays reachable however long a tab grows.
     `help.ENTRIES_MAX_PATH` is what keeps this from ever being how the panel is read. */
  /* One grid over every row, not a flex box per row: a column has to be one width down
     the whole table, and only a shared grid container can size it from the widest action
     in it. `max-content` is that rule -- the same one the desktop panel follows, where
     `panel.layoutHelp` measures `offset_outcome` off the widest action rather than
     guessing a fraction. A flat `44%` was the guess, and on the 558px panel it handed the
     actions 245px they did not want while the outcomes beside them wrapped.
     Both tracks carry the same 122px floor, and the pair of them is measured rather than
     picked: the action floor keeps a tab of short actions from starting its outcomes hard
     left of where every other tab starts them, and the outcome floor is what stops
     `max-content` being greedy on the 262px-wide rows a 320px phone leaves -- without it
     the actions took 208 of those 262 and three tabs grew a scrollbar. 122 + 122 + the
     10px gap is 254, which fits. The rows are one grid but a hidden row contributes no
     track sizing, so each column is measured per tab, from what is actually on screen. */
  .help-rows {
    overflow-y: auto;
    /* Takes whatever the column has left; `min-height: 0` because a flex item defaults to
       its content's minimum and would refuse to shrink, pushing the panel off screen. */
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(122px, max-content) minmax(122px, 1fr);
    column-gap: 10px;
    align-content: start;
  }
  /* `display: contents` so each row's two cells become items of the grid above rather
     than of a box of their own. Safe for the `touch` marker, which hangs off the action
     cell and so keeps a box to hang from. */
  .help-row { display: contents; }
  /* An author `display` beats the UA stylesheet's own `[hidden] { display: none }`, so a
     row hidden by attribute would keep its box and every tab would report the whole table's
     height. Measured: without this line all five tabs scrolled, including the two-row one. */
  .help-row[hidden] { display: none; }
  .help-action {
    padding: 2px 0;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent-ink);
  }
  .help-outcome { padding: 2px 0; color: var(--ink-muted); }
  /* Touch rows carry a word rather than only a colour, so which input a line describes
     survives a reader who cannot tell the two tints apart. */
  .help-touch::after {
    content: "touch";
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 5px;
    margin-left: 6px;
    white-space: nowrap;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: max(60px, env(safe-area-inset-top));
    transform: translateX(-50%);
    pointer-events: none;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink);
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 13px;
    max-width: min(420px, calc(100vw - 28px));
    text-align: center;
    opacity: 0;
    transition: opacity var(--anim) var(--ease);
    z-index: 5;
  }
  .toast.show { opacity: 1; }
  /* A toast carrying something to tap has to be reachable, so it takes pointer events back
     from the rule above -- and it stays until dismissed rather than expiring, since a link
     that vanishes after 3.2 s is a link nobody on a phone gets to in time. */
  .toast.actionable {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-items: stretch;
  }
  .toast-action {
    display: inline-block;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 8px;
    padding: 9px 14px;
    text-decoration: none;
    /* A real touch target, not a text link: this is the last route to a saved file when
       every automatic one is blocked, and it is reached with a thumb. */
    min-height: 38px;
    line-height: 20px;
  }
  /* The saved image itself, offered to press and hold where a frame refuses everything
     else. Capped by viewport height as well as width so a tall phone screenshot still
     leaves the link above it and the dismiss below it on screen. */
  .toast-preview {
    display: block;
    width: 100%;
    max-height: 42vh;
    object-fit: contain;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-solid);
  }
  .toast-hint {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-dim);
  }
  /* What each delivery route answered. Recessive and monospaced: it is evidence to read
     when something did not work, never the message itself. */
  .toast-detail {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 15px;
    color: var(--ink-dim);
    word-break: break-word;
  }
  .toast-dismiss {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-dim);
    background: none;
    border: none;
    padding: 2px;
    cursor: pointer;
  }

  /* ---- Drawer toggle (panel open/close) -- merged onto .brand itself, so this
     ---- rule now only supplies its own open-state accent on top of .brand's base look. */
  .drawer-toggle.on, #btn-menu.on { border-color: var(--accent); color: var(--accent-ink); }

  /* ---- Drawer: the whole panel stack ----
     On the **left**, and slid in from the left, because that is the side the desktop
     build's own panel occupies (`panel.nim`): the two builds are one application reached
     two ways, and a workbench that changes sides between them is a thing to relearn. */
  .drawer {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: min(400px, 100vw);
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform var(--anim) var(--ease);
    z-index: 4;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-scroll {
    flex: 1;
    overflow-y: auto;
    padding: max(14px, env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)) 14px;
  }

  @media (max-width: 519px) {
    /* Narrow phones: five chip-row controls (undo, redo, axes, grid, menu) plus the
       brand chip's full "RGA visualiser" label don't fit on one line -- drop the label,
       keeping just the mark, rather than letting the row wrap or overflow.
       519, measured rather than guessed: the row is swept a pixel at a time and 520 is
       the narrowest viewport where it stops overflowing. This was 480 and wrong by 39
       pixels, so every width from 481 to 519 overflowed -- with the old label, by 50. */
    .brand .name { display: none; }
    .brand { padding: 7px 10px; }
  }

  @media (max-width: 640px) {
    .drawer {
      right: 0; left: 0; top: auto;
      width: auto;
      height: min(78vh, 640px);
      border-right: none;
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      transform: translateY(100%);
    }
    .drawer.open { transform: translateY(0); }
    /* The bottom sheet covers the whole of this corner, so there is no aside to step to. */
    .ruler.aside { display: none; }
  }

  @media (min-width: 641px) {
    /* Above the bottom-sheet breakpoint, the drawer is a full-height side panel whose
       own top edge sits directly under the chip-row's always-visible controls -- give
       its content enough top clearance that the first section header starts below them
       instead of running underneath. */
    .drawer-scroll { padding-top: 62px; }
  }

  /* ---- Sections (collapsing headers, matching panel.nim's own structure) ---- */
  .section { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .section:last-child { border-bottom: none; }
  .section-header {
    appearance: none;
    width: 100%;
    display: flex;
    align-items: center;

  #btn-apply { margin-top: 10px; } /* hr.rule elsewhere in this drawer uses the same

  /* Coefficient grid: stacked one row per grade (0 to n), each row itself wrapping --
     grade 2 in this build's own 4D rigid PGA has 6 members, more than comfortably fits
     one line at the drawer's own width, so a grade's own row wraps onto a second line
     rather than letting a fixed column count cut across grade boundaries instead. */
  .coeff-grid { display: flex; flex-direction: column; gap: 6px; }
  .coeff-grid .field { margin-bottom: 0; }
  .coeff-grid label { font-size: 8.5px; }

  /* ---- Diagnostics ---- */
  .diag-line {
    font-size: 11.5px;
    color: var(--ink-muted);
    margin: 6px 0;
    display: flex;
    justify-content: space-between;
  }
  .diag-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
  /* A parent row is a button so it is reachable by keyboard and announced as one, and is
     otherwise the same row: the chevron and its rotation match the section headers above,
     since both answer "there is more under here". */
  .diag-parent {
    appearance: none;
    background: none;
    border: none;
    padding: 0;
    width: 100%;
    /* Family and weight only, never the `font` shorthand: that resets `font-size` too,
       and `.diag-line`'s own 11.5px is the size every sibling row is read at. */
    font-family: inherit;
    font-weight: inherit;
    text-align: left;
    cursor: pointer;
  }
  .diag-parent .chev {
    display: inline-block;

  .diag-children { display: none; padding-left: 12px; }
  .diag-node.open .diag-children { display: block; }
  .sparkline { width: 100%; height: 40px; display: block; }
  .exceedance { width: 100%; height: 74px; display: block; }
  /* The curve's own caption, in the row idiom the numbers below it use, so the legend and
     the readings read as one column rather than as a chart with a label stuck on. */
  .diag-legend {
    font-size: 10.5px;
    color: var(--ink-faint);
    margin: 2px 0 8px;
    display: flex;
    justify-content: space-between;

  .diag-legend b { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  /* Route-by-route evidence, wrapped rather than clipped: a line the reader cannot finish
     reading is no better than the silence it replaced. */
  .diag-report {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 15px;

  .pool-strip {

    height: 12px;
    margin: 6px 0;
    border-radius: 3px;

  /* Every cell's own colour comes from `nimPoolCellColors`, set inline per frame; this
     background only covers the moment before the first diagnostics refresh runs. */
  .pool-strip span { flex: 1; background: var(--surface-solid); }

  /* ---- Selection menu (touch long-press/tap + mouse click/shift-click) ---- */
  .selection-menu {
    position: fixed;
    z-index: 6;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    display: none;
    align-items: center;
    gap: 5px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .selection-menu.show { display: flex; }
  .selection-menu-reveal {
    /* Animated accordion: "apply" itself never moves (stays the popover's own leftmost,
       first-in-DOM element); this group alone opens to its right when apply is first
       pressed, and closes (back to width 0) on "back" or on any fresh selection change.
       max-width, not width, since a <select> sized to its own content (below) has no
       fixed width of its own to animate toward -- max-width can animate to a fixed
       upper bound and clip via overflow while doing so, "width: auto" cannot animate at
       all. */
    display: flex;
    align-items: center;
    gap: 5px;
    max-width: 0;
    overflow: hidden;
    transition: max-width var(--anim) var(--ease);
  }
  .selection-menu-reveal.open { max-width: 260px; }
  .selection-menu-reveal select {
    width: auto; /* Override the generic select's own width:100%, which fought this
      popover's own content-sized (not fixed-width) container -- auto lets the control
      size to its own text, same as a native <select> does absent an explicit width. */
    max-width: none; /* The wrapping .selection-menu-reveal above is what actually
      bounds/animates the visible width; a second cap here (previously 132px, truncating
      every notation past a couple of characters) was redundant and fought it. */
  }
  .selection-menu button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 9px 12px;
    white-space: nowrap;
  }
  .selection-menu-delete { border-color: #c0304a; color: #ff8fa3; }
  .selection-menu-close { padding: 9px 11px; }

  /* ---- Top menu -- the rare, file-management-flavored actions only (save/load scene,
     save PNG/load demo): a popover under #btn-menu, same fixed/blurred/bordered look as
     .selection-menu. Undo/redo and axes/grid stay live in the chip-row instead -- the
     two things reached for constantly during editing shouldn't cost an extra click. ---- */
  .top-menu {
    position: fixed;
    z-index: 6;
    top: max(60px, calc(env(safe-area-inset-top) + 46px));
    right: max(14px, env(safe-area-inset-right));
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .top-menu.show { display: flex; }
  .top-menu-group { display: flex; gap: 6px; }
  .top-menu .btn { flex: 1; white-space: nowrap; }
  .top-menu-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);

  .top-menu-title:not(:first-child) {

  }

  /* ---- Chip-row action buttons (undo/redo) -- plain bordered .btn look, deliberately
     distinct from .toggles' pill/segmented look below: a bordered rectangle reads as
     "press this, something happens once"; a pill reads as "this shows current state." ---- */
  .action-group { display: flex; gap: 6px; }

  }

             where a frame went rather than one opaque total. The rows that have children
             carry a chevron and open on a click, and every one of them starts closed: a
             reader opens this panel to see whether a frame is slow, and goes looking for
             *which step* only once it is. `refreshDiagnostics` skips whatever is closed,
             so a subtotal nobody is reading costs nothing to keep offering.
             Timings come from the bridge's own clocks inside nimBuildFrame where the step
             is Nim's, and from glue.js around its own calls where it is not. GL rows are

        <div class="diag-node" data-node="build">

            ><b id="diag-build">&mdash;</b></button>

                   reach asks for -- so a scenery figure that rose could not say which of

              <div class="diag-children">

<script>

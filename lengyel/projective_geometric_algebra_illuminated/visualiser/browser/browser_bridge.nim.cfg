# Build browser bridge against same RGA metric desktop build uses --
#   `nim js browser_bridge.nim` picks this up automatically from this directory,
#   same way `visualiser.nim.cfg` is picked up for desktop entry point.
#   No `--backend:cpp` here: `nim js` already fixes backend, and there is no
#   SDL3/OpenGL/Dear ImGui to link -- WebGL/DOM wiring lives in untracked
#   `glue.js`, this build's own presentation layer.

--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

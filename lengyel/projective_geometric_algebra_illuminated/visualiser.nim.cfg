# Build visualiser against RGA metric, with C++ backend Dear ImGui needs.
#   Every library flag lives in module that needs it: `-lSDL3` in `desktop/sdl3`, `-lGL`
#   in `desktop/opengl`, `-lz` in `desktop/image`, all under `visualiser/`.
#   Test binary importing any of them then links without repeating this file.

--backend:cpp
--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

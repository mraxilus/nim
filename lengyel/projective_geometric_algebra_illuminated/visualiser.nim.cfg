# Build the visualiser against the RGA metric, with the C++ backend Dear ImGui needs.
#   Every library flag lives in the module that needs it — `-lSDL3` in `desktop/sdl3`,
#   `-lGL` in `desktop/opengl`, `-lz` in `desktop/image`, all under `visualiser/` — so a
#   test binary importing any of them links without repeating this file.

--backend:cpp
--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

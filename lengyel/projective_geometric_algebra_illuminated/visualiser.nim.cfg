# Build the visualiser against the RGA metric, with the C++ backend Dear ImGui needs.
#   Every library flag lives in the module that needs it — `-lSDL3` in `visualiser/sdl3`,
#   `-lGL` in `visualiser/opengl`, `-lz` in `visualiser/image` — so a test binary importing
#   any of them links without repeating this file.

--backend:cpp
--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

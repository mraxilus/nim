# Configuration for the desktop entry point: a native binary drawing through GL.
#   The algebra's dimension and metric are compile-time defines and are asserted in
#   `core/config.nim`; a wrong pair fails the build with a message naming these flags.
#   Library link flags live in the modules that need them — `platform.nim` names the window
#   and GL libraries, `png.nim` names deflate — so a test binary importing one links without
#   repeating anything here.
define:"pga.dimensions=4"
define:"pga.is_conformal=false"
define:release
passC:"-I../../vendor"

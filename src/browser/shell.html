<!doctype html>
<!--
  Page skeleton for the RGA Workbench's browser build.
  The bundler concatenates: this shell, the embedded faces, the compiled core, and the glue.
  Every panel below is filled from the core at startup; nothing here holds a domain rule.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RGA Workbench</title>
<style>
/* FONT_FACES */
:root {
  --bg: #101318;
  --surface: rgba(22,27,34,.82);
  --surface-solid: #161b22;
  --surface-raised: #1b212b;
  --border: #2a323d;
  --ink: #e7ecf1;
  --ink-muted: #8b96a3;
  --ink-faint: #5b6673;
  --accent: #00a7a5;
  --accent-ink: #bdf3f0;
  --danger: #e0577a;
  /* Duration and curve are written here at startup, read across the boundary. */
  --duration: 350ms;
  --curve: cubic-bezier(0.215, 0.61, 0.355, 1);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans", system-ui, sans-serif; font-size: 14px;
  -webkit-tap-highlight-color: transparent;
}
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* The chip row's own container carries the stacking order: fixed positioning opens a
   stacking context, so a z-index on a descendant cannot outrank its ancestor's sibling. */
#chrome { position: fixed; top: 0; left: 0; right: 0; z-index: 30; pointer-events: none; }
#chips {
  display: flex; gap: 8px; align-items: center; padding: 10px 12px; pointer-events: auto;
  flex-wrap: nowrap;
}
button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer;
  transition: background var(--duration) var(--curve), color var(--duration) var(--curve);
}
button:hover:not(:disabled) { background: var(--surface-raised); }
button:disabled { color: var(--ink-faint); cursor: default; }
button.brand { font-weight: 600; letter-spacing: .02em; }
/* A pill shows state you can read at a glance; a bordered rectangle is a momentary action. */
.pill { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.pill button { border: none; background: transparent; border-radius: 999px; padding: 4px 10px; color: var(--ink-muted); }
.pill button[aria-pressed="true"] { background: var(--surface-raised); color: var(--accent-ink); }
#brand-label { }
@media (max-width: 480px) { #brand-label { display: none; } }

#menu-file {
  position: fixed; top: 52px; right: 12px; z-index: 40; display: none;
  background: var(--surface-solid); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px; min-width: 190px; pointer-events: auto;
}
#menu-file.open { display: block; }
#menu-file h4 { margin: 6px 4px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); font-weight: 600; }
#menu-file button { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; }

#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 400px; z-index: 20;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 56px 12px 24px;
  transform: translateX(100%); transition: transform var(--duration) var(--curve);
}
#drawer.open { transform: translateX(0); }
@media (max-width: 768px) {
  #drawer { top: auto; left: 0; width: auto; height: 62%; border-left: none; border-top: 1px solid var(--border); padding-top: 12px; transform: translateY(100%); }
  #drawer.open { transform: translateY(0); }
}
#intro { color: var(--ink-muted); font-size: 12px; line-height: 1.5; margin: 0 4px 12px; }
details.section { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface-raised); }
details.section > summary { cursor: pointer; padding: 8px 10px; font-weight: 600; color: var(--ink); list-style: none; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > div { padding: 8px 10px 12px; border-top: 1px solid var(--border); }
.row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
.row .grow { flex: 1 1 auto; min-width: 0; }
.name { color: var(--ink-muted); font-size: 12px; }
/* The mono stack names the sans family after its own: Commit Mono carries no bold
   operand or wedge, and CSS falls back per character. */
.mono { font-family: "Commit Mono", "Noto Sans", ui-monospace, monospace; font-size: 12px; }
.reading { color: var(--ink-muted); font-size: 12px; word-break: break-word; margin: 2px 0 6px; }
input[type="text"], input[type="number"], select {
  font: inherit; width: 100%; min-width: 0; color: var(--ink); background: var(--surface-solid);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;
}
input.coefficient { font-family: "Commit Mono", "Noto Sans", ui-monospace, monospace; font-size: 12px; text-align: right; }
.grade-row { display: flex; gap: 4px; margin-bottom: 4px; }
.cell { flex: 1 1 0; min-width: 0; }
.cell label { display: block; text-align: center; font-size: 11px; color: var(--ink-faint); }
.item { border-top: 1px solid var(--border); padding: 6px 0; }
.item.hidden-item { opacity: .45; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
.small { padding: 3px 7px; font-size: 12px; }
.pressed { border-color: var(--accent); color: var(--accent-ink); }

#selection-menu {
  position: fixed; z-index: 25; display: none; gap: 6px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px;
  backdrop-filter: blur(6px);
}
#selection-menu.open { display: flex; }
#picker { display: flex; align-items: center; gap: 6px; max-width: 0; overflow: hidden;
  transition: max-width var(--duration) var(--curve); }
#picker.open { max-width: 60vw; }

#hint {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 15;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 14px; color: var(--ink-muted); font-size: 12px; text-align: center;
  opacity: 1; transition: opacity .6s var(--curve); max-width: 90vw;
}
#hint.faded { opacity: 0; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="chrome">
  <div id="chips">
    <button class="brand" id="chip-drawer" title="Open the workbench drawer">◆<span id="brand-label"> RGA Workbench</span></button>
    <button id="chip-undo" title="Undo">undo</button>
    <button id="chip-redo" title="Redo">redo</button>
    <div class="pill">
      <button id="chip-axes" aria-pressed="true">axes</button>
      <button id="chip-grid" aria-pressed="true">grid</button>
    </div>
    <button id="chip-menu" title="File actions">⋯</button>
  </div>
</div>

<div id="menu-file">
  <h4>save</h4>
  <button id="file-save-scene">scene</button>
  <button id="file-save-image">image</button>
  <h4>load</h4>
  <button id="file-load-scene">scene</button>
  <button id="file-load-demo">demo</button>
</div>

<aside id="drawer">
  <p id="intro"></p>
  <div id="sections"></div>
</aside>

<div id="selection-menu">
  <button id="menu-apply" class="small">apply</button>
  <div id="picker"><select id="picker-select"></select><button id="menu-back" class="small">back</button></div>
  <button id="menu-edit" class="small">edit</button>
  <button id="menu-hide" class="small">hide</button>
  <button id="menu-delete" class="small">delete</button>
  <button id="menu-clear" class="small">✕</button>
</div>

<div id="hint"></div>
<input type="file" id="file-input" accept=".rgascene" style="display:none">
</body>
</html>

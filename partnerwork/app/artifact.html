<title>partner work</title>
<style>
:root {
  color-scheme: light dark;
  --page: #fbfaf8;
  --ink: #1a1a1a;
  --dim: #6b6660;
  --rule: #ddd8d0;
  --rule-strong: #c2bbb0;
  --faint: #948d85;
  --panel: #ffffff;
  --left: #1f5fb4;
  --right: #b4541f;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-in: cubic-bezier(.55, 0, 1, .45);
  --ease-out: cubic-bezier(0, .6, .3, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #16151a;
    --ink: #ece9e4;
    --dim: #9a948c;
    --rule: #33313a;
    --rule-strong: #4a4754;
    --faint: #857f8e;
    --panel: #1e1d24;
    --left: #6ba4ea;
    --right: #e8813f;
  }

* { box-sizing: border-box; }
/* Said aloud, not shown: the drawing is the page for anyone who can see it. */
.said { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The keyboard's answer to :hover. Drawn outside the control, because a chosen
   tab or chip is filled with the very ink the browser would ring it in. */
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#stage:focus-visible { outline-offset: -2px; }
body {
  margin: 0;
  padding: 1.25rem;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
header { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
  margin-bottom: 1rem; }
h1 { font-size: 1.1rem; margin: 0 1rem 0 0; letter-spacing: 0.08em;
  text-transform: uppercase; }
h2 { font-size: 1.25rem; margin: 0.25rem 0 0.5rem; font-weight: 600; }
h3 { font-size: 0.72rem; margin: 0 0 0.75rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--dim); font-weight: 600; }
h4 { font-size: 0.72rem; margin: 1rem 0 0.4rem; letter-spacing: 0.06em;
  color: var(--dim); font-weight: 600; }
h4:first-of-type { margin-top: 0; }
em { font-style: normal; font-weight: 600; }
.tabs { display: flex; gap: 0.25rem; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 7px;
  background: var(--panel); border: 1px solid var(--rule); }
.tab { padding: 0.3rem 0.7rem; font-size: 0.82rem; }
.tab.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
.flat { padding: 0.25rem 0.6rem; font-size: 0.8rem; margin: 0 0.35rem 0.35rem 0; }
/* Never more columns than there are panels: auto-fit will happily reserve a
   fourth track for three panels on a wide screen and leave it empty. */
.stage { display: grid; gap: 1rem; align-items: start;
  grid-template-columns:
    repeat(auto-fit, minmax(max(310px, calc((100% - 2rem) / 3)), 1fr)); }
/* The drawing and the words for its ways out are one thing to read, so once
   there is room for the widest window a frame is cut to with the phrases beside
   it, put them side by side. Before this, no move was on screen at any width
   without scrolling -- on a page whose whole point is which moves are offered. */
@media (min-width: 1100px) {
  .stage:has(> #stage) { grid-template-columns: minmax(0, 1fr) minmax(17rem, 22rem); }
  .stage:has(> #stage) > #stage { grid-column: 1; grid-row: 1 / span 3; }
}
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
  padding: 1rem; }
.panel.wide { grid-column: 1 / -1; }
.panel.muted { color: var(--dim); }
.note { font-size: 0.82rem; color: var(--dim); margin: 0 0 0.75rem; }
.key { font-size: 0.8rem; color: var(--dim); margin: 0 0 0.75rem;
  padding-left: 0.7rem; border-left: 2px solid var(--rule); }
.move { display: block; width: 100%; text-align: left; padding: 0.5rem 0.7rem;
  margin-bottom: 0.35rem; }
.move:hover { border-color: var(--ink); }
.far { padding: 0.4rem 0.1rem; border-bottom: 1px solid var(--rule); }
.far:last-child { border-bottom: 0; }
.phrase { display: block; }
.target { display: block; font-size: 0.8rem; color: var(--dim); }
.history { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; }
.history li { margin-bottom: 0.3rem; }
.stage-head { display: flex; flex-wrap: wrap; align-items: center;
  gap: 0.5rem 1.25rem; margin-bottom: 0.75rem; }
.stage-head h3 { margin: 0; }
.stage-head .tabs.small { margin: 0; }
.views { display: block; }
.view-spokes, .view-map { min-width: 0; }
.view-spokes .note, .view-map .note { margin: 0.5rem 0 0; }
.stage-head h2 { font-size: 1.05rem; margin: 0; }

/* The window on the drawing. Every frame is drawn in one fixed space and seen
   through a window cut to what that frame needs, which is why the window and
   the drawing behind it always move together. */
.viewport { position: relative; overflow: hidden;
  margin: 0 auto; width: var(--w); height: var(--h); }
.spokes { position: absolute; left: 0; top: 0; display: block;
  transform: translate(var(--px), var(--py)); }
.spokes .spoke-line { stroke-width: 3; vector-effect: non-scaling-stroke; }
.spokes .spoke.two .spoke-line { stroke-dasharray: 6 5; stroke-width: 2; }
.spokes .spoke-plate { fill: var(--panel); }
.spokes .node-plate { fill: var(--panel); stroke: var(--rule-strong);
  stroke-width: 1; }
.spokes .node.two .node-plate { stroke-dasharray: 5 4; }
.spokes .node-name { fill: var(--ink); }
.spokes .node.reachable, .spokes .node.two { cursor: pointer; }
.spokes .node.reachable:hover .node-plate,
.spokes .node.two:hover .node-plate { stroke: var(--ink); }

/* A branch grows out of the middle and a leaf out of its own place, so each is
   given the point it moves about rather than borrowing the drawing's. */
.branch, .leaf, .bud, .tag, .core, .mark { transform-box: view-box; }
/* Which frame is held is said by the mark around it, in both drawings and by
   this one rule: a mark can leave one frame for another and a heavier plate
   cannot, and a drawing that did both would be saying it twice. */
.mark { fill: none; stroke: var(--ink); stroke-width: 2; }
.branch { transform-origin: var(--ox) var(--oy); }
.leaf, .bud, .tag { transform-origin: var(--lx) var(--ly); }
.core { transform-origin: var(--ox) var(--oy); }

/* Leaving: the whole move, told in one drawing and in one order.
   The ways not taken fold away, leaves before branches and each a share of the
   budget behind the last. The mark then passes along the way that was taken.
   The frame left behind shrinks away, and the branch it stood on with it. Then
   the drawing recentres on the frame reached, which by now is all there is --
   and what is left is exactly the drawing this frame gets when it is standing
   still, which is why the page can swap one for the other and not be seen. */
@keyframes leaf-fold { to { transform: scale(.4); opacity: 0; } }
@keyframes branch-fold { to { transform: scale(.02); opacity: 0; } }
@keyframes fade { to { opacity: 0; } }
@keyframes pass { to { transform: translate(var(--mx), var(--my)); } }
@keyframes shrink { to { transform: scale(.35); opacity: 0; } }
@keyframes retract { to { transform: scale(.02); opacity: 0; } }
@keyframes reframe { to { width: var(--to-w); height: var(--to-h); } }
@keyframes repan { to { transform: translate(var(--to-px), var(--to-py)); } }

.leaving .going .leaf {
  animation: leaf-fold var(--fold-leaf) var(--ease-in) both;
  animation-delay: calc(var(--turn) * var(--fold-spread));
}
.leaving .going .branch {
  animation: branch-fold var(--fold-branch) var(--ease-in) both;
  animation-delay: calc(var(--fold-lag) + var(--turn) * var(--fold-spread));
}
.leaving .taken .tag {
  animation: fade var(--fold-leaf) ease both;
}
.leaving .mark {
  animation: pass var(--pass) var(--ease-soft) both;
  animation-delay: var(--pass-at);
}
.leaving .core {
  animation: shrink var(--shrink) var(--ease-in) both;
  animation-delay: var(--shrink-at);
}
.leaving .taken .branch {
  /* Retracts into the frame reached rather than into the one being left, since
     that is the end of it that is staying. */
  transform-origin: var(--lx) var(--ly);
  animation: retract var(--shrink) var(--ease-in) both;
  animation-delay: var(--shrink-at);
}
.leaving.viewport {
  animation: reframe var(--centre) var(--ease-soft) both;
  animation-delay: var(--centre-at);
}
.leaving .spokes {
  animation: repan var(--centre) var(--ease-soft) both;
  animation-delay: var(--centre-at);
}

/* Arriving: the frame reached is where it belongs, so its own ways grow out of
   it -- branches first and leaves after, in the order they are drawn. `--turn`
   is a share of the stagger's budget, not a step, so however many ways a frame
   has they finish together. */
@keyframes branch-grow { from { transform: scale(.02); opacity: 0; } }
@keyframes leaf-grow {
  from { transform: scale(.55); opacity: 0; pointer-events: none; }
}
.arriving .branch {
  animation: branch-grow var(--grow) var(--ease) both;
  animation-delay: calc(var(--grow-delay) + var(--turn) * var(--grow-spread));
}
.arriving .leaf {
  animation: leaf-grow var(--grow) var(--ease-out) both;
  animation-delay: calc(var(--grow-delay) + var(--leaf-delay) +
    var(--turn) * var(--grow-spread));

@media (prefers-reduced-motion: reduce) {
  .branch, .leaf, .bud, .tag, .core, .mark, .spokes, .viewport {
    animation: none !important; transition: none !important; }
}
.legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.78rem;
  color: var(--dim); align-items: center; margin-left: auto; }
.swatch { display: inline-flex; align-items: center; gap: 0.4rem; }
.swatch i { width: 1.3rem; height: 3px; border-radius: 2px; display: block; }
.swatch i.arm-left { background: var(--left); }
.swatch i.arm-right { background: var(--right); }
.swatch.aside { padding-left: 1rem; border-left: 1px solid var(--rule);
  font-style: italic; }
.scroll { overflow-x: auto; }
.tabs.small { margin-bottom: .6rem; }
.tabs.small .tab { font-size: 0.72rem; padding: 0.16rem 0.5rem; }
/* The map has every frame in place already, so a move is only the mark going
   from one to another and what is within reach of it changing as it goes.
   Nothing is built and nothing is torn down, which is why it is quick. */
.map { width: 100%; min-width: 620px; height: auto; display: block; }
/* Quiet is put on the ink, never on the group. A group carries its own plates,
   and a plate at 40% stops hiding what it is there to hide: the lines under a
   frame, and the lines under a name. */
.map .way .edge, .map .way text { opacity: .4; }
.map.unread .way .edge, .map.unread .way text { opacity: .8; }
.map .way.lit .edge, .map .way.lit text { opacity: 1; }
.map .edge { stroke-width: 2; }
.map .way.lit .edge { stroke-width: 3.5; }
.map .way.taking .edge { stroke-width: 5; }
.map .join .arc, .map .join text { opacity: .5; }
.map .join.lit .arc, .map .join.lit text { opacity: 1; }
.map .arc { fill: none; stroke-width: 1.5; stroke-dasharray: 5 4; }
.map .join.lit .arc { stroke-width: 2; }
.map .edge-plate, .map .arc-plate { fill: var(--panel); }
.name-plate { fill: var(--panel); }
.map .node-plate { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
.map .node .frame, .map .node .node-name { opacity: .4; }
.map .node.here .frame, .map .node.here .node-name,
.map .node.reachable .frame, .map .node.reachable .node-name,
.map .node.two .frame, .map .node.two .node-name { opacity: 1; }
.map .node.reachable { cursor: pointer; }
.map .node.reachable .node-plate { stroke: var(--rule-strong); }
.map .node.reachable:hover .node-plate, .map .node.two:hover .node-plate {
  stroke: var(--ink); }
.map .node.two { cursor: pointer; }
.map .node.two .node-plate { stroke: var(--rule-strong); stroke-dasharray: 5 4; }
/* Drawn as the frame being reached will have it, with whatever that changes
   faded from how the frame being left had it: what the mark lands on is then
   already the drawing for where it landed. */
@keyframes wake { from { opacity: .4; } }
@keyframes doze { from { opacity: 1; } }
.map.leaving .waking .edge, .map.leaving .waking .arc,
.map.leaving .waking .frame, .map.leaving .waking .node-name,
.map.leaving .waking text {
  animation: wake var(--pass) var(--ease-soft) both;
  animation-delay: var(--pass-at); }
.map.leaving .dozing .edge, .map.leaving .dozing .arc,
.map.leaving .dozing .frame, .map.leaving .dozing .node-name,
.map.leaving .dozing text {
  animation: doze var(--pass) var(--ease-soft) both;
  animation-delay: var(--pass-at); }
.move.two { border-style: dashed; }
.map.leaving .mark { animation: pass var(--pass) var(--ease-soft) both;
  animation-delay: var(--pass-at); }
.map .edge.taking { opacity: 1; stroke-width: 5; }
.map .node.taking .node-plate { stroke: var(--ink); stroke-width: 2; }
.matrix { border-collapse: collapse; font-size: 0.78rem; }
.matrix th { font-weight: 500; color: var(--dim); text-align: left;
  padding: 0.2rem 0.35rem; }
.matrix thead th span { display: block; }
.matrix tr th:first-child { max-width: 15rem; }
.matrix th:not(.row) { height: 9rem; vertical-align: bottom; }
.matrix th:not(.row) span { writing-mode: vertical-rl; transform: rotate(180deg); }
.matrix td { width: 1.6rem; height: 1.6rem; text-align: center;
  border: 1px solid var(--rule); }
.matrix td.on { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.matrix td.self { background: var(--rule); }
.matrix td.two { color: var(--dim); font-style: italic; }
.filters { display: flex; flex-wrap: wrap; gap: 0.35rem 1.5rem;
  margin-bottom: 0.75rem; }
.question { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; }
.asks { font-size: 0.72rem; letter-spacing: 0.06em; color: var(--dim);
  margin-right: 0.15rem; }
.chip { padding: 0.16rem 0.55rem; font-size: 0.76rem; border-radius: 999px; }
.chip.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
.gallery { display: grid; gap: 0.75rem;
  grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); }
.card { padding: 0.5rem; text-align: center; }
.card:hover { border-color: var(--ink); }
.card .frame { width: 100%; height: auto; display: block; margin-bottom: 0.3rem; }
.card .phrase { font-size: 0.82rem; line-height: 1.3; }
.card .target { margin-top: 0.15rem; }
